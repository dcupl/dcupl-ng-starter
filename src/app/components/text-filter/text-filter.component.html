<label [for]="'filter-' + definition().attribute" class="mb-2 block text-xs font-semibold text-black-700">
  {{ definition().label }}
</label>
<div class="flex gap-2">
  <input
    #searchInput
    [id]="'filter-' + definition().attribute"
    type="text"
    class="h-9 min-w-0 flex-1 rounded border-black-500 bg-white-50 px-2.5 text-base placeholder:text-black-600 hover:border-black-50 focus:border-black-50 focus:ring-0 sm:text-sm"
    placeholder="e.g.: Ball, Yoga, ..."
    (keyup.Enter)="applyQuery(searchInput.value)"
  />
  <button type="button" class="dcu-button dcu-button-black" (click)="applyQuery(searchInput.value)">
    Apply
  </button>
</div>
