<fieldset>
  <legend class="mb-2 text-xs font-semibold text-black-700">
    {{ definition().label }}
    <span class="font-normal text-black-600">({{ facets().length }})</span>
  </legend>
  <ul class="-mx-2 max-h-60 overflow-y-auto lg:max-h-96">
    @for (facet of facets(); track $index) {
      <li>
        <label
          [for]="definition().attribute + '-' + $index"
          class="flex cursor-pointer items-center gap-3 rounded px-2 py-1.5 text-sm select-none hover:bg-black-100 has-disabled:cursor-not-allowed has-disabled:opacity-50"
        >
          <input
            [id]="definition().attribute + '-' + $index"
            type="checkbox"
            [checked]="facet.selected"
            [disabled]="!facet.enabled"
            (change)="toggle(facet)"
            class="size-4 shrink-0 cursor-pointer rounded border-black-500 text-black-50 focus:ring-0 focus:ring-offset-0"
          />
          <span class="min-w-0 flex-1 truncate">{{ facet.key }}</span>
          <span class="dcu-tag">{{ facet.size }}</span>
        </label>
      </li>
    }
  </ul>
</fieldset>
