<aside aria-labelledby="filters-title" class="overflow-hidden rounded-xl border border-black-200">
  <h2
    id="filters-title"
    class="flex h-12 items-center bg-black-100 px-4 text-xs tracking-[0.12em] text-black-700 uppercase"
  >
    Filters
  </h2>
  <div class="divide-y divide-black-200">
    @for (definition of filterDefinitions; track definition.attribute) {
      <div class="p-4">
        @if (definition.type === 'text') {
          <app-text-filter [list]="list()" [definition]="definition"></app-text-filter>
        } @else if (definition.type === 'checkbox') {
          <app-checkbox-filter [list]="list()" [definition]="definition"></app-checkbox-filter>
        }
      </div>
    }
  </div>
</aside>
