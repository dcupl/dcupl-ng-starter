<div class="mx-auto w-full max-w-screen-2xl px-4 py-6 sm:px-8 sm:py-10 xl:px-12">
  <div class="mb-6 sm:mb-8">
    <h1 class="text-xl font-semibold">Article Catalog</h1>
    <p class="mt-1 text-sm text-black-600">
      This starter loads data from a public dcupl starter project. Check it out at
      <a
        href="https://console.dcupl.com"
        target="_blank"
        rel="noopener"
        class="border-b border-current text-black-50 transition-colors hover:text-blue-300"
        >console.dcupl.com</a
      >.
    </p>
  </div>

  @if (error(); as message) {
    <div role="alert" class="max-w-xl rounded-xl border border-red-200 bg-red-100 p-5 sm:p-6">
      <h2 class="text-base font-semibold">Could not load data</h2>
      <p class="mt-1 text-sm break-words text-black-700">{{ message }}</p>
      <button type="button" (click)="load()" class="dcu-button dcu-button-black mt-4">
        Retry
      </button>
    </div>
  } @else if (list(); as catalogList) {
    <div class="grid items-start gap-6 lg:grid-cols-[18rem_minmax(0,1fr)] lg:gap-8">
      <app-filter-bar [list]="catalogList"></app-filter-bar>
      <app-product-table class="min-w-0" [list]="catalogList"></app-product-table>
    </div>
  } @else {
    <div
      role="status"
      class="flex flex-col items-center justify-center gap-4 rounded-xl border border-black-200 py-24"
    >
      <img src="dcupl-logo.svg" alt="" class="h-8 w-auto motion-safe:animate-spin" />
      <p class="text-sm text-black-600">Loading data</p>
    </div>
  }
</div>
