<div class="flex w-full flex-col h-full">
  <div class="p-3 bg-gray-100">
    <div class="container mx-auto">
      <h3 class="text-2xl">dcupl ng starter - Catalog Example</h3>
    </div>
  </div>
  <div class="flex h-full container mx-auto pt-8">
    @if (error(); as message) {
    <div class="w-full flex flex-col gap-3 justify-center items-center">
      <h4 class="text-xl">Could not load data</h4>
      <p class="text-sm text-gray-600">{{ message }}</p>
      <button
        type="button"
        (click)="load()"
        class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-500"
      >
        Retry
      </button>
    </div>
    } @else if (list(); as catalogList) {
    <div class="w-[300px] flex shrink-0 mr-5 pr-5 border-r border-gray-100">
      <app-filter-bar [list]="catalogList"></app-filter-bar>
    </div>
    <div class="w-full h-full overflow-x-hidden">
      <app-product-table
        [list]="catalogList"
        [visibleColumns]="visibleColumns()"
      ></app-product-table>
    </div>
    } @else {
    <div class="w-full flex justify-center items-center">
      <h4 class="text-xl">Loading Data</h4>
    </div>
    }
  </div>
</div>
